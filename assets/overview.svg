<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="580" viewBox="0 0 1800 580" role="img" aria-labelledby="title desc">
  <title id="title">MM-ContextASR overview</title>
  <desc id="desc">Three-stage overview of data construction, multimodal context training, and benchmark evaluation.</desc>
  <defs>
    <style>
      .stage { font: 700 25px Arial, Helvetica, sans-serif; fill: #2563a9; letter-spacing: 1px; }
      .label { font: 600 23px Arial, Helvetica, sans-serif; fill: #202a3c; }
      .small { font: 400 19px Arial, Helvetica, sans-serif; fill: #5a6474; }
      .tiny { font: 600 17px Arial, Helvetica, sans-serif; fill: #435065; }
    </style>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#8fa3bb"/>
    </marker>
  </defs>
  <rect width="1800" height="640" fill="#ffffff"/>
  <rect x="30" y="28" width="1740" height="524" rx="12" fill="#f8fafc" stroke="#d8e0ea" stroke-width="2"/>
  <line x1="610" y1="65" x2="610" y2="520" stroke="#d7e0ea" stroke-width="2"/>
  <line x1="1190" y1="65" x2="1190" y2="520" stroke="#d7e0ea" stroke-width="2"/>

  <text x="320" y="91" text-anchor="middle" class="stage">DATA PIPELINE</text>
  <circle cx="155" cy="255" r="58" fill="#e6f1fb" stroke="#75a9d6" stroke-width="3"/>
  <text x="155" y="249" text-anchor="middle" class="label">Entity</text>
  <text x="155" y="278" text-anchor="middle" class="small">anchor</text>
  <line x1="220" y1="255" x2="288" y2="255" stroke="#8fa3bb" stroke-width="4" marker-end="url(#arrow)"/>
  <circle cx="360" cy="255" r="58" fill="#edf7f3" stroke="#6caf91" stroke-width="3"/>
  <text x="360" y="249" text-anchor="middle" class="label">Confusion</text>
  <text x="360" y="278" text-anchor="middle" class="small">pair</text>
  <line x1="425" y1="255" x2="493" y2="255" stroke="#8fa3bb" stroke-width="4" marker-end="url(#arrow)"/>
  <circle cx="550" cy="255" r="48" fill="#fff3df" stroke="#d7a85d" stroke-width="3"/>
  <text x="550" y="251" text-anchor="middle" class="label">5</text>
  <text x="550" y="279" text-anchor="middle" class="small">scenarios</text>
  <path d="M155 355 C220 325, 290 390, 360 352 S495 325, 550 360" fill="none" stroke="#4e8dc4" stroke-width="5"/>
  <path d="M155 389 C220 359, 290 424, 360 386 S495 359, 550 394" fill="none" stroke="#73b59a" stroke-width="5" opacity="0.9"/>
  <text x="355" y="455" text-anchor="middle" class="label">Aligned speech-text dialogues</text>
  <text x="355" y="488" text-anchor="middle" class="small">synthesis and quality control</text>

  <text x="900" y="91" text-anchor="middle" class="stage">CONTEXT TRAINING</text>
  <rect x="675" y="205" width="180" height="66" rx="8" fill="#e6f1fb" stroke="#75a9d6" stroke-width="2"/>
  <text x="765" y="245" text-anchor="middle" class="label">Speech</text>
  <rect x="675" y="290" width="180" height="66" rx="8" fill="#eef1f6" stroke="#9daabb" stroke-width="2"/>
  <text x="765" y="330" text-anchor="middle" class="label">Transcript</text>
  <rect x="675" y="375" width="180" height="66" rx="8" fill="#edf7f3" stroke="#6caf91" stroke-width="2"/>
  <text x="765" y="415" text-anchor="middle" class="label">Assistant</text>
  <line x1="875" y1="323" x2="938" y2="323" stroke="#8fa3bb" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="960" y="235" width="185" height="176" rx="22" fill="#2563a9"/>
  <text x="1052" y="305" text-anchor="middle" style="font:700 24px Arial,Helvetica,sans-serif;fill:#fff">LLM-Based</text>
  <text x="1052" y="338" text-anchor="middle" style="font:700 24px Arial,Helvetica,sans-serif;fill:#fff">ASR</text>
  <text x="1052" y="377" text-anchor="middle" style="font:400 17px Arial,Helvetica,sans-serif;fill:#dcecff">current-turn loss</text>
  <text x="910" y="482" text-anchor="middle" class="label">No Context · Text · Speech · Speech+Text</text>
  <text x="910" y="515" text-anchor="middle" class="small">four controlled context settings</text>

  <text x="1480" y="91" text-anchor="middle" class="stage">BENCHMARK &amp; EVALUATION</text>
  <text x="1480" y="205" text-anchor="middle" class="label">MM-ContextASR Bench</text>
  <g transform="translate(1250 245)">
    <rect x="0" y="0" width="136" height="48" rx="7" fill="#e6f1fb"/>
    <rect x="150" y="0" width="136" height="48" rx="7" fill="#edf7f3"/>
    <rect x="300" y="0" width="136" height="48" rx="7" fill="#fff3df"/>
    <rect x="70" y="68" width="136" height="48" rx="7" fill="#f2eefa"/>
    <rect x="230" y="68" width="160" height="48" rx="7" fill="#fbecec"/>
    <text x="68" y="30" text-anchor="middle" class="tiny">Irrelevant</text>
    <text x="218" y="30" text-anchor="middle" class="tiny">Implicit</text>
    <text x="368" y="30" text-anchor="middle" class="tiny">Explicit</text>
    <text x="138" y="98" text-anchor="middle" class="tiny">Correction</text>
    <text x="310" y="98" text-anchor="middle" class="tiny">Repeated Error</text>
  </g>
  <line x1="1260" y1="395" x2="1700" y2="395" stroke="#d7e0ea" stroke-width="2"/>
  <text x="1480" y="438" text-anchor="middle" class="label">External evaluation protocols</text>
  <text x="1480" y="478" text-anchor="middle" class="small">KeSpeech · CV-Yue · AliMeeting Far</text>
  <text x="1480" y="522" text-anchor="middle" class="label">CER · SER · Entity Recall</text>
</svg>
